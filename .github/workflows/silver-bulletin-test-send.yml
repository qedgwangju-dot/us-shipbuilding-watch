name: Silver Bulletin Telegram 테스트 발송

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/silver-bulletin-test-send.yml'

jobs:
  test-send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 저장소 불러오기
        uses: actions/checkout@v4

      - name: Telegram 테스트 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request

          state = json.loads(pathlib.Path('silver_bulletin_state.json').read_text(encoding='utf-8'))
          values = state['values']
          source = state['source']
          date = state.get('data_date', '')

          def v(key):
              return f"{float(values[key]['value']):+.1f}%p"

          text = (
              '<b>[테스트] Silver Bulletin 트럼프 이슈 지지율 감시</b>\n\n'
              f"물가·생활비: {v('cost_of_living')}\n"
              f"경제: {v('economy')}\n"
              f"이민: {v('immigration')}\n"
              f"무역·관세: {v('trade')}\n\n"
              + (f"기준일: {date}\n" if date else '')
              + f'🔗 <a href="{source}">원문</a>'
          )

          token = (os.getenv('TELEGRAM_BOT_TOKEN') or '').strip()
          chat_id = (os.getenv('TELEGRAM_CHAT_ID') or '').strip()
          if not token or not chat_id:
              raise RuntimeError('Telegram secrets missing')

          payload = urllib.parse.urlencode({
              'chat_id': chat_id,
              'text': text,
              'parse_mode': 'HTML',
              'disable_web_page_preview': 'true',
          }).encode('utf-8')
          req = urllib.request.Request(
              f'https://api.telegram.org/bot{token}/sendMessage',
              data=payload,
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=25) as r:
              result = json.loads(r.read().decode('utf-8'))
          if not result.get('ok'):
              raise RuntimeError(result)
          print(f"telegram_test_sent=true message_id={(result.get('result') or {}).get('message_id')}")
          PY
