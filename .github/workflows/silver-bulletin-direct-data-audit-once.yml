name: Silver Bulletin direct-source independent audit (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/silver-bulletin-direct-data-audit-once.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Independently refetch published Datawrapper snapshots
        run: |
          python - <<'PY'
          import csv, io, json, urllib.request
          from pathlib import Path
          state=json.loads(Path("silver_bulletin_state.json").read_text(encoding="utf-8"))
          accepted = [
              (7893, "2026-10-11", {"cost":-47.54833,"econ":-29.93589,"immg":-11.98257,"trade":-28.67488}),
              (7953, "2026-10-15", {"cost":-45.56345,"econ":-29.86373,"immg":-11.57838,"trade":-28.23003}),
              (7957, "2026-10-15", {"cost":-48.92509,"econ":-32.92413,"immg":-11.60148,"trade":-30.55493}),
              (7962, "2026-10-15", {"cost":-48.92509,"econ":-32.92413,"immg":-11.60148,"trade":-30.55493}),
          ]
          results=[]
          for rev, d, vals in accepted:
              url=f"https://datawrapper.dwcdn.net/RFXsV/{rev}/dataset.csv"
              request=urllib.request.Request(url,headers={
                  "User-Agent":"Mozilla/5.0 SilverBulletin-IndependentSourceAudit/1.0",
                  "Cache-Control":"no-cache",
              })
              with urllib.request.urlopen(request,timeout=25) as r:
                  raw=r.read().decode("utf-8-sig")
                  status=r.status
              rows=list(csv.DictReader(io.StringIO(raw)))
              if not rows:raise RuntimeError(f"Empty published dataset {rev}")
              latest=rows[-1]
              observed_date=latest.get("modeldate","")
              actual={k:float(latest[k]) for k in vals}
              matched=observed_date==d and all(abs(actual[k]-vals[k])<0.00001 for k in vals)
              result={"revision":rev,"date":observed_date,"expected_date":d,
                      "values":actual,"matches_saved_snapshot":matched,
                      "rows":len(rows),"http_status":status}
              results.append(result)
              print(json.dumps(result,ensure_ascii=False))
          Path("silver_bulletin_source_audit_results.json").write_text(
              json.dumps(results,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          if not all(x["matches_saved_snapshot"] for x in results):
              raise RuntimeError("Official publisher dataset differs from saved values")
          if state.get("data_date")!="2026-10-15":
              raise RuntimeError("Unexpected current Silver Bulletin saved date")
          print("independent_datawrapper_crosscheck=PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silver-bulletin-source-audit-${{ github.run_id }}
          path: silver_bulletin_source_audit_results.json
          if-no-files-found: ignore
          retention-days: 5
