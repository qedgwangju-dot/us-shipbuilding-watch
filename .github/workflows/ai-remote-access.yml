name: 미국 AI 칩·원격접근 규제 웹감시

# 기준선 초기화 후 운영 버전
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ai_remote_access_watch.py'
      - 'monitor.py'
      - 'requirements.txt'
      - '.github/workflows/ai-remote-access.yml'

permissions:
  contents: write

concurrency:
  group: us-ai-remote-access-watch
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 불러오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 필요한 패키지 설치
        run: pip install -r requirements.txt

      - name: AI 칩·원격접근 규제 변화 확인
        env:
          AI_REMOTE_TELEGRAM_BOT_TOKEN: ${{ secrets.AI_REMOTE_TELEGRAM_BOT_TOKEN }}
          AI_REMOTE_TELEGRAM_CHAT_ID: ${{ secrets.AI_REMOTE_TELEGRAM_CHAT_ID }}
        run: python ai_remote_access_watch.py

      - name: 감시 상태 저장
        run: |
          if git diff --quiet -- ai_remote_state.json; then
            echo "상태 변화 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_remote_state.json
          git commit -m "Update AI remote-access monitor state"
          git push
