name: 미국 AI 칩·원격접근 규제 웹감시

# 새 봇 토큰을 사용하고 기존 수신 chat_id는 재사용
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ai_remote_access_watch.py'
      - 'ai_remote_access_watch_v2.py'
      - 'ai_remote_access_watch_v3.py'
      - 'ai_remote_access_watch_v4.py'
      - 'ai_remote_access_watch_v5.py'
      - 'monitor.py'
      - 'requirements.txt'
      - '.github/workflows/ai-remote-access.yml'

permissions:
  contents: write

concurrency:
  group: us-ai-remote-access-watch
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 불러오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 필요한 패키지 설치
        run: pip install -r requirements.txt

      - name: AI 칩·원격접근 규제 변화 확인
        env:
          AI_REMOTE_TELEGRAM_BOT_TOKEN: ${{ secrets.AI_REMOTE_TELEGRAM_BOT_TOKEN }}
          AI_REMOTE_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ai_remote_access_watch_v5.py

      - name: 감시 상태 저장
        run: |
          if [ -z "$(git status --porcelain -- ai_remote_state.json)" ]; then
            echo "상태 변화 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_remote_state.json
          git commit -m "Update AI remote-access monitor state"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "상태 저장 충돌 재시도 ${attempt}/3"
            sleep $((attempt * 2))
          done
          echo "상태 파일 저장 실패"
          exit 1
