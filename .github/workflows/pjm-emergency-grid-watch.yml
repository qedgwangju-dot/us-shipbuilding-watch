name: 미국 전력망 비상운영·PJM 웹감시

on:
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'pjm_emergency_grid_watch.py'
      - 'pjm_emergency_grid_watch_v2.py'
      - 'pjm_emergency_grid_watch_v3.py'
      - 'pjm_emergency_grid_watch_v4.py'
      - 'requirements.txt'
      - '.github/workflows/pjm-emergency-grid-watch.yml'

permissions:
  contents: write

concurrency:
  group: us-pjm-emergency-grid-watch
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 불러오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 필요한 패키지 설치
        run: pip install -r requirements.txt

      - name: PJM 비상운영·DOE 202(c) 변화 확인
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pjm_emergency_grid_watch_v4.py

      - name: 감시 상태 저장
        run: |
          if [ -z "$(git status --porcelain -- pjm_emergency_grid_state.json)" ]; then
            echo "상태 변화 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pjm_emergency_grid_state.json
          git commit -m "Update PJM emergency grid monitor state"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "상태 저장 충돌 재시도 ${attempt}/3"
            sleep $((attempt * 2))
          done
          echo "상태 파일 저장 실패"
          exit 1
