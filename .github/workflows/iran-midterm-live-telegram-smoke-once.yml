name: Iran midterm one-time Telegram delivery smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iran-midterm-live-telegram-smoke-once.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify real Telegram bot and clickable original source
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import html, json, os, urllib.parse, urllib.request

          token=(os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat=(os.getenv("TELEGRAM_CHAT_ID") or "").strip()
          if not token or not chat:
              raise RuntimeError("Telegram credentials missing")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe",timeout=20) as r:
              identity=json.loads(r.read().decode())
          name=(identity.get("result") or {}).get("username")
          if not identity.get("ok") or name!="khs88798879_bot":
              raise RuntimeError("Wrong bot selected")

          original="https://truthsocial.com/@realDonaldTrump/117406186276133332"
          checked="https://www.reuters.com/world/trump-us-having-productive-talks-with-iran-will-not-attack-before-us-elections-2026-10-08/"
          msg=(
              "<b>[테스트] 이란·11월 3일 중간선거 감시 연결</b>\n\n"
              "확인된 기준 발언: 2026-10-08 트럼프 대통령은 11월 3일 선거 전 이란을 공격하지 않겠다고 발표했습니다.\n"
              "향후 감시: 발언 번복·선거 후 공격 위협·실제 미국의 새로운 대이란 공격\n"
              "구분: 공격 검토는 확정 군사행동으로 알리지 않음\n"
              "기존 호르무즈·유가·지지율 경로는 중복하지 않음\n\n"
              f'<a href="{html.escape(original,quote=True)}">원문</a>'
              " · "
              f'<a href="{html.escape(checked,quote=True)}">교차검증</a>'
              "\n\n이 메시지는 연결 시험이며 새로운 군사행동 발생을 뜻하지 않습니다."
          )
          if "🔗" in msg or len(msg)>3000:
              raise RuntimeError("Telegram formatting regression")
          params=urllib.parse.urlencode({
              "chat_id":chat,"text":msg,"parse_mode":"HTML",
              "disable_web_page_preview":"true"
          }).encode()
          req=urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=params,method="POST",
          )
          with urllib.request.urlopen(req,timeout=25) as resp:
              payload=json.loads(resp.read().decode())
          result=payload.get("result") or {}
          urls={x.get("url") for x in result.get("entities") or [] if x.get("type")=="text_link"}
          if not payload.get("ok") or result.get("message_id") is None or not {original,checked}.issubset(urls):
              raise RuntimeError("Telegram delivery or both clickable link entities failed")
          print(
              f"telegram_bot_verified=@{name} "
              f"telegram_message_id={result['message_id']} "
              "verified_source_links=2 no_emoji_verified=true"
          )
          PY
