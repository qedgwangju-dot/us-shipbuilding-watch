name: 미국 조선·전력망 정책 웹감시

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'monitor.py'
      - 'runner.py'
      - 'grid_monitor.py'
      - 'grid_monitor_v2.py'
      - 'requirements.txt'
      - '.github/workflows/monitor.yml'

permissions:
  contents: write

concurrency:
  group: us-policy-watch
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 불러오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 필요한 패키지 설치
        run: pip install -r requirements.txt

      - name: 조선·해군 정책 변화 확인
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MODE: '0'
        run: python runner.py

      - name: 전력망·전력기기 정책 변화 확인
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python grid_monitor_v2.py

      - name: 감시 상태 저장
        run: |
          if git diff --quiet -- state.json grid_state.json; then
            echo "상태 변화 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json grid_state.json
          git commit -m "Update monitor states"
          git push
