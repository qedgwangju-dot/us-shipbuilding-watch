name: 대미투자 Telegram 감시 v5

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'us_investment_watch.py'
      - 'us_investment_watch_v3.py'
      - 'us_investment_watch_v4.py'
      - 'us_investment_watch_v5.py'
      - '.github/workflows/us-investment-telegram-watch-v3.yml'

permissions:
  contents: write

concurrency:
  group: us-investment-telegram-watch-v5
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 코드 검증
        run: |
          python -m py_compile us_investment_watch.py
          python -m py_compile us_investment_watch_v3.py
          python -m py_compile us_investment_watch_v4.py
          python -m py_compile us_investment_watch_v5.py
      - name: 대미투자 중요 변화 확인
        run: python us_investment_watch_v5.py
      - name: Telegram 전송
        if: hashFiles('us_investment_alert.html') != ''
        env:
          BOT_TOKEN: ${{ secrets.KHS887900_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          token=(os.getenv('BOT_TOKEN') or '').strip(); chat=(os.getenv('CHAT_ID') or '').strip()
          if not token or not chat: raise RuntimeError('Telegram routing secret missing')
          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=20) as r:
              me=json.loads(r.read().decode())
          username=str((me.get('result') or {}).get('username') or '')
          if username.lower()!='khs887900_bot': raise RuntimeError(f'wrong bot @{username}')
          text=pathlib.Path('us_investment_alert.html').read_text(encoding='utf-8').strip()
          data=urllib.parse.urlencode({'chat_id':chat,'text':text,'parse_mode':'HTML','disable_web_page_preview':'true'}).encode()
          req=urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage',data=data,method='POST')
          with urllib.request.urlopen(req,timeout=25) as r: result=json.loads(r.read().decode())
          if not result.get('ok'): raise RuntimeError(str(result))
          print(f"telegram_delivery_confirmed=true bot=@{username} message_id={(result.get('result') or {}).get('message_id')}")
          PY
      - name: 상태 저장
        if: success() && hashFiles('us_investment_state.json') != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add us_investment_state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update US investment monitor state'
          for i in 1 2 3; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
