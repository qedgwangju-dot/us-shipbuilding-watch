name: 대미투자 Telegram 감시 v13

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'us_investment_watch.py'
      - 'us_investment_watch_v3.py'
      - 'us_investment_watch_v5.py'
      - 'us_investment_watch_v9.py'
      - 'us_investment_watch_v10.py'
      - 'us_investment_watch_v11.py'
      - 'us_investment_watch_v12.py'
      - 'us_investment_watch_v13.py'
      - '.github/workflows/us-investment-telegram-watch-v3.yml'

permissions:
  contents: write

concurrency:
  group: us-investment-telegram-watch-v13
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 코드 검증
        run: |
          python -m py_compile us_investment_watch.py
          python -m py_compile us_investment_watch_v3.py
          python -m py_compile us_investment_watch_v5.py
          python -m py_compile us_investment_watch_v9.py
          python -m py_compile us_investment_watch_v10.py
          python -m py_compile us_investment_watch_v11.py
          python -m py_compile us_investment_watch_v12.py
          python -m py_compile us_investment_watch_v13.py
          python us_investment_watch_v13.py --self-test
      - name: 대미투자 누적 내용 변화 확인
        if: github.event_name != 'push'
        run: python us_investment_watch_v13.py
      - name: Telegram 전송
        if: github.event_name != 'push' && hashFiles('us_investment_alert.html') != ''
        env:
          BOT_TOKEN: ${{ secrets.KHS887900_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          token=(os.getenv('BOT_TOKEN') or '').strip(); chat=(os.getenv('CHAT_ID') or '').strip()
          if not token or not chat: raise RuntimeError('Telegram routing secret missing')
          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=20) as r:
              me=json.loads(r.read().decode())
          username=str((me.get('result') or {}).get('username') or '')
          if username.lower()!='khs887900_bot': raise RuntimeError(f'wrong bot @{username}')
          text=pathlib.Path('us_investment_alert.html').read_text(encoding='utf-8').strip()
          plain=__import__('re').sub(r'<[^>]+>', '', text)
          re_mod=__import__('re')
          if re_mod.search(r'APR1400[^\\n]{0,100}2\\s*기\\s*(?:→|->|에서)\\s*8\\s*기', plain, re_mod.I):
              raise RuntimeError('blocked invalid APR1400 2-to-8 transition')
          if re_mod.search(r'미분류\\s*-\\d+\\s*기', plain):
              raise RuntimeError('blocked negative unclassified reactor count')
          total8=bool(re_mod.search(r'(?:전체|총)\\s*8\\s*기|원전\\s*(?:최대\\s*)?8\\s*기', plain))
          ap8=bool(re_mod.search(r'AP1000[^\\n]{0,100}\\b8\\s*기', plain, re_mod.I))
          apr8=bool(re_mod.search(r'APR1400[^\\n]{0,100}\\b8\\s*기', plain, re_mod.I))
          if total8 and ap8 and apr8:
              raise RuntimeError('blocked reactor composition double count')
          if re_mod.search(r'첫\\s*(?:송금|납입)[^\\n]{0,120}3,?500\\s*억\\s*달러|3,?500\\s*억\\s*달러[^\\n]{0,120}첫\\s*(?:송금|납입)', plain):
              raise RuntimeError('blocked total investment leaked into first remittance')
          if '첫 송금·납입 예정일' in plain and '2026-07-24' in plain:
              raise RuntimeError('blocked unrelated July 24 date as first remittance date')
          data=urllib.parse.urlencode({'chat_id':chat,'text':text,'parse_mode':'HTML','disable_web_page_preview':'true'}).encode()
          req=urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage',data=data,method='POST')
          with urllib.request.urlopen(req,timeout=25) as r: result=json.loads(r.read().decode())
          if not result.get('ok'): raise RuntimeError(str(result))
          print(f"telegram_delivery_confirmed=true bot=@{username} message_id={(result.get('result') or {}).get('message_id')}")
          PY
      - name: 상태 저장
        if: github.event_name != 'push' && success() && hashFiles('us_investment_state.json') != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add us_investment_state.json us_investment_fact_state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update US investment cumulative fact state'
          for i in 1 2 3; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
