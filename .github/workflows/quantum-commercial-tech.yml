name: 양자컴퓨팅 상용화·기술검증 웹감시

on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'quantum_commercial_tech_watch.py'
      - 'test_quantum_commercial_tech_watch.py'
      - 'requirements.txt'
      - '.github/workflows/quantum-commercial-tech.yml'

permissions:
  contents: write

concurrency:
  group: quantum-commercial-tech-watch
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 불러오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 최신 main 상태 동기화
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "runtime_head=$(git rev-parse HEAD)"

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 필요한 패키지 설치
        run: pip install -r requirements.txt

      - name: 회귀검사
        run: |
          python -m py_compile quantum_commercial_tech_watch.py
          PYTHONPATH=. python test_quantum_commercial_tech_watch.py

      - name: Telegram 경로 확인
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token=(os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id=(os.getenv("TELEGRAM_CHAT_ID") or "").strip()
          if not token or not chat_id:
              raise RuntimeError("Telegram Secret 없음")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe",timeout=25) as r:
              data=json.loads(r.read().decode("utf-8"))
          if not data.get("ok"):
              raise RuntimeError(f"Telegram getMe 실패: {data}")
          username=str((data.get("result") or {}).get("username") or "")
          print(f"telegram_bot_verified=@{username} chat_id_configured=true")
          PY

      - name: 양자 상용화·기술검증 변화 확인
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python quantum_commercial_tech_watch.py

      - name: 감시 상태 저장
        run: |
          if [ -z "$(git status --porcelain -- quantum_commercial_tech_state.json)" ]; then
            echo "상태 변화 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quantum_commercial_tech_state.json
          git commit -m "Update quantum commercial tech monitor state"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "상태 저장 충돌 재시도 ${attempt}/3"
            sleep $((attempt * 2))
          done
          echo "상태 파일 저장 실패"
          exit 1

      - name: 검증 산출물 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantum-commercial-tech-${{ github.run_id }}
          path: |
            quantum_commercial_tech_state.json
            quantum_commercial_tech_delivery.json
          if-no-files-found: ignore
          retention-days: 14
