name: 원전 Janus 전체 Telegram 웹감시

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nuclear-janus-all-telegram-watch.yml'
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nuclear-janus-all-telegram-khs887900
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_BOT_USERNAME: 'khs887900_bot'
      BOT_TOKEN: ${{ secrets.KHS887900_BOT_TOKEN }}
      CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout state repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout nuclear watcher source
        uses: actions/checkout@v4
        with:
          repository: qedgwangju-dot/khs-watch
          path: upstream
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 deep-translator

      - name: Verify exact Telegram route
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token=(os.getenv('BOT_TOKEN') or '').strip()
          chat=(os.getenv('CHAT_ID') or '').strip()
          expected=(os.getenv('EXPECTED_BOT_USERNAME') or '').strip().lstrip('@')
          if not token or not chat:
              raise RuntimeError('KHS887900 Telegram routing secret missing')
          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=20) as r:
              me=json.loads(r.read().decode('utf-8'))
          actual=str((me.get('result') or {}).get('username') or '')
          if not me.get('ok') or actual.lower()!=expected.lower():
              raise RuntimeError(f'wrong bot: expected @{expected}, got @{actual or "unknown"}')
          print(f'telegram_route_valid=true bot=@{actual}')
          PY

      - name: Restore migrated watcher state
        run: |
          mkdir -p upstream/data upstream/out
          if [ -f nuclear_janus_state.json ]; then
            cp nuclear_janus_state.json upstream/data/janus_watch_v2_state.json
          fi

      - name: Validate watcher
        run: |
          python -m py_compile upstream/scripts/janus_watch.py upstream/scripts/janus_watch_v2.py upstream/scripts/janus_watch_v3.py upstream/scripts/janus_watch_v4.py upstream/scripts/janus_watch_v5.py upstream/scripts/janus_watch_v6.py
          python upstream/scripts/janus_watch_v6.py --mode self-test

      - name: Run all nuclear and Janus web watch
        run: |
          python upstream/scripts/janus_watch_v6.py --mode check
          cat upstream/out/janus_status_v2.md >> "$GITHUB_STEP_SUMMARY"
          if [ -s upstream/out/janus_errors_v2.log ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '## 부분 조회 오류' >> "$GITHUB_STEP_SUMMARY"
            cat upstream/out/janus_errors_v2.log >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Reject broken alerts
        if: hashFiles('upstream/out/janus_alert_v2.html') != '' || hashFiles('upstream/out/westinghouse_alert.html') != ''
        run: |
          python - <<'PY'
          from pathlib import Path
          import html, re, sys
          sys.path.insert(0, 'upstream/scripts')
          import janus_watch_v2 as j
          for path in [Path('upstream/out/janus_alert_v2.html'), Path('upstream/out/westinghouse_alert.html')]:
              if not path.exists():
                  continue
              text=path.read_text(encoding='utf-8').strip()
              if not text:
                  continue
              plain=html.unescape(re.sub(r'<[^>]+>', '', text))
              if j._BAD_TITLE_RE.search(plain):
                  raise RuntimeError(f'blocked error-page alert: {path}')
          print('telegram_alert_preflight=passed')
          PY

      - name: Build one-time full migration test
        run: |
          if [ ! -f nuclear_janus_route_verified.txt ]; then
            cat > nuclear_janus_route_test.html <<'EOF'
          <b>[원전·Janus 웹감시] 전체 송출 경로 이동 완료</b>

          • 수신 봇: <b>@khs887900_bot</b>
          • 대상: Janus · 신규/재가동 원전 · 원전 정책·금융·설비투자 · SMR · 핵연료·공급망 · Westinghouse 지분·원전동맹
          • 확인 주기: 15분
          • 기존 @hs8879887988798879_bot으로는 이 원전·Janus 감시를 더 이상 송출하지 않음
          • 같은 이슈는 중복 제거·묶음 처리, 영어 설명은 한국어 번역 후 송출
          EOF
          fi

      - name: Build one-time expanded nuclear scope test
        run: |
          if [ ! -f nuclear_scope_expansion_v2.txt ]; then
            cat > nuclear_scope_expansion_test.html <<'EOF'
          <b>[원전 웹감시] 감시 범위 확장 완료</b>

          • 수신 봇: <b>@khs887900_bot</b>
          • 추가 감시: <b>APR1400 미국 진출·미국 원전 8기·한수원/Westinghouse 협력</b>
          • 추가 감시: <b>한수원-체코 원전 연계 청정수소·HYTEP·CEZ 실증</b>
          • 추가 감시: <b>Holtec IPO·SMR-300·Palisades·현대건설 협력·자금조달</b>
          • 공식 교차검증: <b>한국수력원자력·산업통상부·Holtec 공식 발표</b>
          • 언론 보도와 공식 확정은 분리 표기하고, 대미 원전 8기·APR1400 기수·투자금은 정부 확정 전까지 협상 단계로 표시
          • 확인 주기: 15분
          EOF
          fi

      - name: Send all alerts to khs887900 bot
        if: hashFiles('nuclear_janus_route_test.html') != '' || hashFiles('nuclear_scope_expansion_test.html') != '' || hashFiles('upstream/out/janus_alert_v2.html') != '' || hashFiles('upstream/out/westinghouse_alert.html') != ''
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          token=os.environ['BOT_TOKEN'].strip(); chat=os.environ['CHAT_ID'].strip(); expected=os.environ['EXPECTED_BOT_USERNAME'].strip().lstrip('@')
          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=20) as r:
              me=json.loads(r.read().decode('utf-8'))
          actual=str((me.get('result') or {}).get('username') or '')
          if not me.get('ok') or actual.lower()!=expected.lower():
              raise RuntimeError(f'wrong bot: expected @{expected}, got @{actual or "unknown"}')
          files=[
              pathlib.Path('nuclear_janus_route_test.html'),
              pathlib.Path('nuclear_scope_expansion_test.html'),
              pathlib.Path('upstream/out/janus_alert_v2.html'),
              pathlib.Path('upstream/out/westinghouse_alert.html'),
          ]
          ids=[]
          for path in files:
              if not path.exists():
                  continue
              text=path.read_text(encoding='utf-8').strip()
              if not text:
                  continue
              chunks=[]
              while len(text)>3800:
                  cut=text.rfind('\n\n',0,3800)
                  if cut<1000: cut=3800
                  chunks.append(text[:cut].strip()); text=text[cut:].strip()
              if text: chunks.append(text)
              for chunk in chunks:
                  payload=urllib.parse.urlencode({'chat_id':chat,'text':chunk,'parse_mode':'HTML','disable_web_page_preview':'true'}).encode('utf-8')
                  req=urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage',data=payload,method='POST')
                  with urllib.request.urlopen(req,timeout=30) as r:
                      result=json.loads(r.read().decode('utf-8'))
                  if not result.get('ok'):
                      raise RuntimeError(str(result))
                  ids.append((result.get('result') or {}).get('message_id'))
          print(f'nuclear_janus_delivery_confirmed=true bot=@{actual} messages={len(ids)} ids={ids}')
          PY

      - name: Mark route and expanded scope verified
        if: success()
        run: |
          if [ -f nuclear_janus_route_test.html ]; then
            printf 'verified target=@khs887900_bot\n' > nuclear_janus_route_verified.txt
          fi
          if [ -f nuclear_scope_expansion_test.html ]; then
            printf 'verified expanded nuclear scope target=@khs887900_bot\n' > nuclear_scope_expansion_v2.txt
          fi

      - name: Persist watcher state
        if: success() && hashFiles('upstream/out/janus_watch_v2_state_pending.json') != ''
        run: cp upstream/out/janus_watch_v2_state_pending.json nuclear_janus_state.json

      - name: Commit state
        if: success()
        run: |
          git config user.name 'nuclear-janus-watch[bot]'
          git config user.email 'nuclear-janus-watch[bot]@users.noreply.github.com'
          git add nuclear_janus_state.json nuclear_janus_route_verified.txt nuclear_scope_expansion_v2.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'state unchanged'
          else
            git commit -m 'Update nuclear Janus watch state'
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep $((i*2))
            done
            exit 1
          fi
