name: 원전 Janus 전체 Telegram 웹감시

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nuclear-janus-all-telegram-watch.yml'
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nuclear-janus-all-telegram-khs887900
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_BOT_USERNAME: 'khs887900_bot'
      BOT_TOKEN: ${{ secrets.KHS887900_BOT_TOKEN }}
      CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout state repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout nuclear watcher source
        uses: actions/checkout@v4
        with:
          repository: qedgwangju-dot/khs-watch
          path: upstream
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 deep-translator

      - name: Verify exact Telegram route
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token=(os.getenv('BOT_TOKEN') or '').strip()
          chat=(os.getenv('CHAT_ID') or '').strip()
          expected=(os.getenv('EXPECTED_BOT_USERNAME') or '').strip().lstrip('@')
          if not token or not chat:
              raise RuntimeError('KHS887900 Telegram routing secret missing')
          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=20) as r:
              me=json.loads(r.read().decode('utf-8'))
          actual=str((me.get('result') or {}).get('username') or '')
          if not me.get('ok') or actual.lower()!=expected.lower():
              raise RuntimeError(f'wrong bot: expected @{expected}, got @{actual or "unknown"}')
          print(f'telegram_route_valid=true bot=@{actual}')
          PY

      - name: Restore watcher state
        run: |
          mkdir -p upstream/data upstream/out
          if [ -f nuclear_janus_state.json ]; then
            cp nuclear_janus_state.json upstream/data/janus_watch_v2_state.json
          fi

      - name: Validate v9 watcher
        run: |
          python -m py_compile upstream/scripts/janus_watch.py upstream/scripts/janus_watch_v2.py upstream/scripts/janus_watch_v3.py upstream/scripts/janus_watch_v4.py upstream/scripts/janus_watch_v5.py upstream/scripts/janus_watch_v6.py upstream/scripts/janus_watch_v7.py upstream/scripts/janus_watch_v8.py upstream/scripts/janus_watch_v9.py
          python upstream/scripts/janus_watch_v9.py --mode self-test

      - name: Run all nuclear and Janus web watch v9
        run: |
          python upstream/scripts/janus_watch_v9.py --mode check
          cat upstream/out/janus_status_v2.md >> "$GITHUB_STEP_SUMMARY"
          if [ -s upstream/out/janus_errors_v2.log ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '## 부분 조회 오류' >> "$GITHUB_STEP_SUMMARY"
            cat upstream/out/janus_errors_v2.log >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Reject broken alerts
        if: hashFiles('upstream/out/janus_alert_v2.html') != '' || hashFiles('upstream/out/westinghouse_alert.html') != ''
        run: |
          python - <<'PY'
          from pathlib import Path
          import html, re, sys
          sys.path.insert(0, 'upstream/scripts')
          import janus_watch_v2 as j
          for path in [Path('upstream/out/janus_alert_v2.html'), Path('upstream/out/westinghouse_alert.html')]:
              if not path.exists():
                  continue
              text=path.read_text(encoding='utf-8').strip()
              if not text:
                  continue
              plain=html.unescape(re.sub(r'<[^>]+>', '', text))
              if j._BAD_TITLE_RE.search(plain):
                  raise RuntimeError(f'blocked error-page alert: {path}')
          print('telegram_alert_preflight=passed')
          PY

      - name: Build one-time v8 upgrade test
        run: |
          if [ ! -f nuclear_us_v8_estimate_verified.txt ]; then
            cat > nuclear_us_v8_estimate_test.html <<'EOF'
          <b>[미국 원전 웹감시] 두산 수주추정·생산능력 검산 업그레이드</b>

          • 수신 봇: <b>@khs887900_bot</b>
          • '두산 32조·40조' 같은 헤드라인은 <b>확정수주와 분리</b>
          • <b>탑다운:</b> 1,200억달러 총사업비 × 15~30% 주기기 비중을 최신 환율로 자동 검산
          • <b>바텀업:</b> AP1000 4,000억~5,000억원/기 · APR1400 2조5,000억~3조원/기 기준으로 노형별 수주범위 비교
          • 실제 장납기 발주·공급품목·납기·생산능력 증설·수주잔고를 조기경보로 추적
          EOF
          fi

      - name: Build one-time SMR special law v9 test
        run: |
          if [ ! -f nuclear_smr_v9_policy_verified.txt ]; then
            cat > nuclear_smr_v9_policy_test.html <<'EOF'
          <b>[한국 SMR 특별법·i-SMR 웹감시] v9 업그레이드 완료</b>

          • 수신 봇: <b>@khs887900_bot</b>
          • 특별법·시행령: <b>2026년 9월 11일 시행</b>
          • 최초 기본계획: <b>2027년 9월 11일까지</b> · 최초 시행계획은 기본계획 후 <b>3개월 이내</b>
          • 법 자체 총예산은 없으므로 <b>기본계획 총재원·세부사업별 예산·민간자금</b>이 공개되는 순간 금액을 우선 추적
          • <b>특구 지역·민관 공동출자 회사 주주·출자액·연구조합·핵연료 공급망</b>을 실제 사업화 촉매로 감시
          • <b>i-SMR 표준설계인가와 부지별 건설허가를 분리</b>하고 2035 상용화는 정책목표로 표시
          • 실증 부지·기반시설·건설·운영·실증비·부품 표준화·시험 기자재 공동구매가 실제 발주로 연결되는지 추적
          EOF
          fi

      - name: Send all alerts to khs887900 bot
        if: hashFiles('nuclear_us_v8_estimate_test.html') != '' || hashFiles('nuclear_smr_v9_policy_test.html') != '' || hashFiles('upstream/out/janus_alert_v2.html') != '' || hashFiles('upstream/out/westinghouse_alert.html') != ''
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          token=os.environ['BOT_TOKEN'].strip(); chat=os.environ['CHAT_ID'].strip(); expected=os.environ['EXPECTED_BOT_USERNAME'].strip().lstrip('@')
          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=20) as r:
              me=json.loads(r.read().decode('utf-8'))
          actual=str((me.get('result') or {}).get('username') or '')
          if not me.get('ok') or actual.lower()!=expected.lower():
              raise RuntimeError(f'wrong bot: expected @{expected}, got @{actual or "unknown"}')
          files=[
              pathlib.Path('nuclear_us_v8_estimate_test.html'),
              pathlib.Path('nuclear_smr_v9_policy_test.html'),
              pathlib.Path('upstream/out/janus_alert_v2.html'),
              pathlib.Path('upstream/out/westinghouse_alert.html'),
          ]
          ids=[]
          for path in files:
              if not path.exists():
                  continue
              text=path.read_text(encoding='utf-8').strip()
              if not text:
                  continue
              chunks=[]
              while len(text)>3800:
                  cut=text.rfind('\n\n',0,3800)
                  if cut<1000: cut=3800
                  chunks.append(text[:cut].strip()); text=text[cut:].strip()
              if text: chunks.append(text)
              for chunk in chunks:
                  payload=urllib.parse.urlencode({'chat_id':chat,'text':chunk,'parse_mode':'HTML','disable_web_page_preview':'true'}).encode('utf-8')
                  req=urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage',data=payload,method='POST')
                  with urllib.request.urlopen(req,timeout=30) as r:
                      result=json.loads(r.read().decode('utf-8'))
                  if not result.get('ok'):
                      raise RuntimeError(str(result))
                  ids.append((result.get('result') or {}).get('message_id'))
          print(f'nuclear_janus_delivery_confirmed=true bot=@{actual} messages={len(ids)} ids={ids}')
          PY

      - name: Mark upgrade verified
        if: success()
        run: |
          if [ -f nuclear_us_v8_estimate_test.html ]; then
            printf 'verified v8 Doosan estimate and capacity checks target=@khs887900_bot\n' > nuclear_us_v8_estimate_verified.txt
          fi
          if [ -f nuclear_smr_v9_policy_test.html ]; then
            printf 'verified v9 SMR special law and i-SMR policy watch target=@khs887900_bot\n' > nuclear_smr_v9_policy_verified.txt
          fi

      - name: Persist watcher state
        if: success() && hashFiles('upstream/out/janus_watch_v2_state_pending.json') != ''
        run: cp upstream/out/janus_watch_v2_state_pending.json nuclear_janus_state.json

      - name: Commit state
        if: success()
        run: |
          git config user.name 'nuclear-janus-watch[bot]'
          git config user.email 'nuclear-janus-watch[bot]@users.noreply.github.com'
          git add nuclear_janus_state.json nuclear_us_v8_estimate_verified.txt nuclear_smr_v9_policy_verified.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'state unchanged'
          else
            git commit -m 'Update nuclear Janus v9 watch state'
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep $((i*2))
            done
            exit 1
          fi
