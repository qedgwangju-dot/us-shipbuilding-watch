name: Silver Bulletin one-time live Telegram format verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/silver-bulletin-live-smoke.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install watcher imports
        run: pip install -r requirements.txt
      - name: Verify actual recipient, actual HTML link, and message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, pathlib, sys, urllib.parse, urllib.request

          # Import the exact function used by the production workflow.
          class StubSession:
              def __init__(self):
                  self.headers = {}
              def get(self, *args, **kwargs):
                  raise RuntimeError("No external page lookup in format-only smoke")
          # Requests + BeautifulSoup are installed in the next step (below).
          from silver_bulletin_watch import format_telegram_html, PAGE_URL
          state = json.loads(pathlib.Path("silver_bulletin_state.json").read_text(encoding="utf-8"))
          vals = state["values"]
          labels = [("cost_of_living", "물가·생활비"),
                    ("economy", "경제"),
                    ("immigration", "이민"),
                    ("trade", "무역·관세")]
          lines = ["[테스트] Silver Bulletin Telegram 링크·송출 경로 검증", ""]
          lines.extend(f"- {label}: {float(vals[key]['value']):+.1f}%p" for key, label in labels)
          lines.extend(["", "- 기준일: " + state["data_date"], "- 원문: " + PAGE_URL])
          message = format_telegram_html("\n".join(lines))
          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat = os.environ["TELEGRAM_CHAT_ID"].strip()

          with urllib.request.urlopen(
              "https://api.telegram.org/bot" + token + "/getMe", timeout=20
          ) as resp:
              identity = json.loads(resp.read().decode("utf-8"))
          actual = (identity.get("result") or {}).get("username")
          if not identity.get("ok") or actual != "khs88798879_bot":
              raise RuntimeError("Incorrect destination bot username")

          payload = urllib.parse.urlencode({
              "chat_id": chat,
              "text": message,
              "parse_mode": "HTML",
              "disable_web_page_preview": "true",
          }).encode("utf-8")
          request = urllib.request.Request(
              "https://api.telegram.org/bot" + token + "/sendMessage",
              data=payload, method="POST",
          )
          with urllib.request.urlopen(request, timeout=25) as resp:
              delivered = json.loads(resp.read().decode("utf-8"))
          if not delivered.get("ok"):
              raise RuntimeError("Telegram rejected message")
          result = delivered.get("result") or {}
          entities = result.get("entities") or []
          verified_link = any(
              e.get("type") == "text_link" and e.get("url") == PAGE_URL
              for e in entities
          )
          verified_no_emoji = "🔗" not in result.get("text", "")
          if not verified_link or not verified_no_emoji:
              raise RuntimeError("Source link or emoji regression")
          print(
              f"telegram_bot_verified=@{actual} "
              f"telegram_message_id={result.get('message_id')} "
              f"link_verified=true no_emoji_verified=true "
              f"data_date={state['data_date']}"
          )
          PY
