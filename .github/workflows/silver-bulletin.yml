name: Silver Bulletin 트럼프 이슈 지지율 감시

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'silver_bulletin_watch.py'
      - 'tests/test_silver_bulletin.py'
      - '.github/workflows/silver-bulletin.yml'
      - 'silver_bulletin_state.json'

permissions:
  contents: write

concurrency:
  group: silver-bulletin-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 저장소 불러오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 지연 실행 시 원격 최신 기준값 동기화
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 필요한 패키지 설치
        run: pip install -r requirements.txt

      - name: Telegram 송출 봇 확인
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          EXPECTED_BOT_USERNAME: 'khs88798879_bot'
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token=(os.getenv('TELEGRAM_BOT_TOKEN') or '').strip()
          expected=os.environ['EXPECTED_BOT_USERNAME'].lstrip('@')
          if not token:
              raise RuntimeError('TELEGRAM_BOT_TOKEN secret missing')
          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=20) as r:
              obj=json.loads(r.read().decode('utf-8'))
          actual=str((obj.get('result') or {}).get('username') or '')
          if not obj.get('ok') or actual.lower()!=expected.lower():
              raise RuntimeError(f'Wrong Telegram bot: expected @{expected}, got @{actual or "unknown"}')
          print(f'telegram_bot_verified=@{actual}')
          PY

      - name: Silver Bulletin 회귀 테스트
        run: python -m unittest discover -s tests -p 'test_silver_bulletin.py' -v

      - name: Silver Bulletin 수치 확인
        run: |
          if ! python silver_bulletin_watch.py; then
            cat out/silver_bulletin_status.txt >> "$GITHUB_STEP_SUMMARY" || true
            exit 1
          fi
          cat out/silver_bulletin_status.txt >> "$GITHUB_STEP_SUMMARY"

      - name: 변경 시 Telegram 알림
        if: hashFiles('out/silver_bulletin_alert.txt') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import html, json, os, pathlib, urllib.parse, urllib.request
          token=(os.getenv('TELEGRAM_BOT_TOKEN') or '').strip()
          chat_id=(os.getenv('TELEGRAM_CHAT_ID') or '').strip()
          if not chat_id:
              raise RuntimeError('TELEGRAM_CHAT_ID secret missing')

          from silver_bulletin_watch import format_telegram_html
          raw=pathlib.Path('out/silver_bulletin_alert.txt').read_text(encoding='utf-8')
          text=format_telegram_html(raw)

          payload=urllib.parse.urlencode({
              'chat_id': chat_id,
              'text': text,
              'parse_mode': 'HTML',
              'disable_web_page_preview': 'true',
          }).encode('utf-8')
          req=urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage', data=payload, method='POST')
          with urllib.request.urlopen(req, timeout=25) as r:
              result=json.loads(r.read().decode('utf-8'))
          if not result.get('ok'):
              raise RuntimeError(f'Telegram rejected message: {result}')
          print(f"telegram_delivery_confirmed=true message_id={(result.get('result') or {}).get('message_id')}")
          PY

      - name: 정상 검증 후 최신 상태 저장
        if: success() && hashFiles('out/silver_bulletin_state_pending.json') != ''
        run: cp out/silver_bulletin_state_pending.json silver_bulletin_state.json

      - name: 기준값 GitHub 저장
        if: success() && hashFiles('silver_bulletin_state.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add silver_bulletin_state.json
          if git diff --cached --quiet; then
            echo "Silver Bulletin 기준값 변화 없음"
          else
            git commit -m "Update Silver Bulletin state"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                echo "Silver Bulletin state_persisted=true"
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 2))
            done
            echo "Silver Bulletin 상태 저장 반복 실패" >&2
            exit 1
          fi

      - name: 실패 시 Telegram 오류 알림
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: https://github.com/qedgwangju-dot/us-shipbuilding-watch/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import subprocess
          import time
          import urllib.parse
          import urllib.request

          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat = (os.getenv("TELEGRAM_CHAT_ID") or "").strip()
          if not token or not chat:
              raise RuntimeError("Telegram 설정 누락: 실패 경고를 송출할 수 없습니다")

          state_path = pathlib.Path("silver_bulletin_error_state.json")
          try:
              previous = json.loads(state_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              previous = {}
          now = dt.datetime.now(dt.timezone.utc)
          try:
              last = dt.datetime.fromisoformat(str(previous.get("last_sent_utc") or ""))
              if last.tzinfo is None:
                  last = last.replace(tzinfo=dt.timezone.utc)
          except ValueError:
              last = None
          if last is not None and 0 <= (now-last).total_seconds() < 12*3600:
              print("silver_bulletin_error_alert_suppressed=true reason=12h_dedupe")
              raise SystemExit(0)

          data = urllib.parse.urlencode({
              "chat_id": chat,
              "text": "[Silver Bulletin 지지율 감시] 실행 오류\n"
                      "이번 확인에서 원자료 조회·검증 또는 Telegram 송출·상태 저장이 실패했습니다. "
                      "확인되지 않은 수치는 보내지 않습니다.\n"
                      "실행 기록: " + os.environ["RUN_URL"],
              "disable_web_page_preview": "true",
          }).encode("utf-8")
          request = urllib.request.Request(
              "https://api.telegram.org/bot" + token + "/sendMessage",
              data=data, method="POST",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              receipt = json.loads(response.read().decode("utf-8"))
          if not receipt.get("ok") or (receipt.get("result") or {}).get("message_id") is None:
              raise RuntimeError("Telegram failure alarm not acknowledged")

          state_path.write_text(json.dumps({
              "last_sent_utc": now.isoformat(),
              "run_url": os.environ["RUN_URL"],
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          def git(*args):
              return subprocess.run(["git", *args], check=False).returncode == 0
          git("config", "user.name", "github-actions[bot]")
          git("config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
          if not git("add", str(state_path)):
              raise RuntimeError("Cannot stage failure alert state")
          if not git("commit", "-m", "Update Silver Bulletin error alert state"):
              raise RuntimeError("Cannot commit failure alert state")
          for attempt in range(1, 6):
              if git("pull", "--rebase", "origin", "main") and git("push"):
                  print("silver_bulletin_error_alert_sent=true state_persisted=true")
                  break
              git("rebase", "--abort")
              time.sleep(attempt*2)
          else:
              raise RuntimeError("Telegram failure alarm sent, but dedupe state commit failed")
          PY

      - name: 검증 자료 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silver-bulletin-${{ github.run_id }}
          path: |
            out/silver_bulletin_status.txt
            out/silver_bulletin_debug.json
            out/silver_bulletin_alert.txt
            out/silver_bulletin_state_pending.json
          if-no-files-found: ignore
          retention-days: 14
