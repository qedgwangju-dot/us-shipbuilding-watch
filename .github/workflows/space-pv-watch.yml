name: 미국 우주태양광 정부지원·조달 웹감시

on:
  schedule:
    - cron: '8 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'space_pv_watch.py'
      - 'requirements.txt'
      - '.github/workflows/space-pv-watch.yml'

permissions:
  contents: write

concurrency:
  group: us-space-pv-watch
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 불러오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 필요한 패키지 설치
        run: pip install -r requirements.txt

      - name: 미국 우주태양광 상태 변화 확인
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python space_pv_watch.py

      - name: 감시 상태 저장
        run: |
          if [ -z "$(git status --porcelain -- space_pv_state.json)" ]; then
            echo "상태 변화 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add space_pv_state.json
          git commit -m "Update space PV monitor state"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "상태 저장 충돌 재시도 ${attempt}/3"
            sleep $((attempt * 2))
          done
          exit 1
