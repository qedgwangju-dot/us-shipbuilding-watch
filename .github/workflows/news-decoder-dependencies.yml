name: News decoder dependency regression
on:
  pull_request:
    paths:
      - 'requirements.txt'
      - 'tests/test_news_decoder_dependencies.py'
      - '.github/workflows/news-decoder-dependencies.yml'
  push:
    branches: [main]
    paths:
      - 'requirements.txt'
      - 'tests/test_news_decoder_dependencies.py'
      - '.github/workflows/news-decoder-dependencies.yml'
permissions:
  contents: read
jobs:
  decoder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_news_decoder_dependencies.py -v
