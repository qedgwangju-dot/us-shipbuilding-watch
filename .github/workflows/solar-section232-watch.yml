name: 미국 태양광 Section 232 보조 RSS 탐색 - 수동

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 불러오기
        uses: actions/checkout@v4

      - name: 안내
        run: |
          echo "자동 송출 중지: 공식 Federal Register/BIS 중심 solar-polysilicon-232-watch가 운영 경로입니다."
          echo "이 워크플로는 과거 재노출·영문 제목·우주태양광 혼입 문제로 수동 점검용으로만 유지합니다."
