name: 트럼프 정유업계 고유가 대응 Telegram 웹감시

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  pull_request:
    paths:
      - 'refinery_watch.py'
      - 'spr_venezuela_watch.py'
      - 'requirements.txt'
      - 'readable_energy_alert_runner*.py'
      - 'energy_delivery.py'
      - 'energy_state_checkpoint.py'
      - 'tests/test_energy_delivery.py'
      - '.github/workflows/refinery-policy-telegram-watch.yml'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'refinery_watch.py'
      - 'spr_venezuela_watch.py'
      - 'readable_energy_alert_runner.py'
      - 'readable_energy_alert_runner_v2.py'
      - 'energy_delivery.py'
      - 'energy_state_checkpoint.py'
      - 'tests/test_energy_delivery.py'
      - '.github/workflows/refinery-policy-telegram-watch.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('refinery-policy-telegram-watch-pr-{0}', github.event.pull_request.number) || 'refinery-policy-telegram-watch' }}
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_energy_delivery.py' -v

  monitor:
    needs: offline-tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 저장소 불러오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 필요한 패키지 설치
        run: pip install -r requirements.txt

      - name: 감시 코드 문법 확인
        run: |
          python -m py_compile refinery_watch.py
          python -m py_compile spr_venezuela_watch.py
          python -m py_compile readable_energy_alert_runner.py
          python -m py_compile readable_energy_alert_runner_v2.py

      - name: 정유업계·SPR 변화 묶음 확인 및 가독성형 Telegram 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python readable_energy_alert_runner_v2.py

      - name: Preserve delivery receipts and ambiguity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: energy-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            out/energy_delivery_*.json
            refinery_watch_state.json
            spr_venezuela_watch_state.json
            energy_delivery_state.json
