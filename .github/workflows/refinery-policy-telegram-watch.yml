name: 트럼프 정유업계 고유가 대응 Telegram 웹감시

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'refinery_watch.py'
      - 'spr_venezuela_watch.py'
      - 'spr_venezuela_watch_runner.py'
      - '.github/workflows/refinery-policy-telegram-watch.yml'

permissions:
  contents: write

concurrency:
  group: refinery-policy-telegram-watch
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 저장소 불러오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 필요한 패키지 설치
        run: pip install -r requirements.txt

      - name: Telegram 알림 문구 정리
        run: |
          sed -i '/"<b>본문 한국어 번역<\/b>",/d' refinery_watch.py
          sed -i '/"<b>본문 한국어 번역<\/b>",/d' spr_venezuela_watch.py

      - name: 감시 코드 문법 확인
        run: |
          python -m py_compile refinery_watch.py
          python -m py_compile spr_venezuela_watch.py
          python -m py_compile spr_venezuela_watch_runner.py

      - name: 정유업계·고유가 정책 변화 확인 및 Telegram 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python refinery_watch.py

      - name: SPR·베네수엘라 원유 공식수치·정책 변화 확인 및 Telegram 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python spr_venezuela_watch_runner.py

      - name: 감시 상태 저장
        if: always()
        run: |
          files=""
          [ -f refinery_watch_state.json ] && files="$files refinery_watch_state.json"
          [ -f spr_venezuela_watch_state.json ] && files="$files spr_venezuela_watch_state.json"
          if [ -z "$files" ]; then
            echo "감시 상태 파일 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $files
          if git diff --cached --quiet; then
            echo "상태 변화 없음"
            exit 0
          fi
          git commit -m "Update refinery and SPR watch states" || exit 0
          git pull --rebase origin main
          git push
