name: 미국 양자컴퓨팅 정부투자·조달·지분 웹감시

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'quantum_government_investment_watch.py'
      - 'quantum_government_investment_watch_v2.py'
      - 'quantum_government_investment_watch_v3.py'
      - 'quantum_government_investment_watch_v5.py'
      - 'quantum_government_investment_watch_v6.py'
      - 'quantum_government_investment_watch_v7.py'
      - 'requirements.txt'
      - '.github/workflows/quantum-government-investment.yml'

permissions:
  contents: write

concurrency:
  group: us-quantum-government-investment-watch
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 불러오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 필요한 패키지 설치
        run: pip install -r requirements.txt

      - name: 미국 양자컴퓨팅 정부투자·조달·지분 변화 확인
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python quantum_government_investment_watch_v7.py

      - name: 감시 상태 저장
        run: |
          if [ -z "$(git status --porcelain -- quantum_government_investment_state.json)" ]; then
            echo "상태 변화 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quantum_government_investment_state.json
          git commit -m "Update quantum government investment monitor state"
          git push
